name: Test curl_cffi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test curl_cffi against PVR API
        run: |
          pip install curl_cffi
          python3 -c "
          from curl_cffi import requests
          resp = requests.post(
              'https://api3.pvrcinemas.com/api/v1/booking/content/nowshowing',
              json={'city': 'Chennai'},
              headers={
                  'chain': 'PVR', 'platform': 'WEBSITE', 'country': 'INDIA',
                  'flow': 'PVRINOX', 'appVersion': '1.0', 'city': 'Chennai',
                  'Origin': 'https://www.pvrcinemas.com',
                  'Referer': 'https://www.pvrcinemas.com/',
              },
              impersonate='chrome',
              timeout=15,
          )
          print(f'HTTP {resp.status_code}')
          if resp.status_code in (200, 302):
              movies = resp.json().get('output', {}).get('mv', [])
              print(f'Movies: {len(movies)}')
          else:
              print(resp.text[:500])
          "
